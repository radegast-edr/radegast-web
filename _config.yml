title: "Radegast EDR"
description: "Open-source, privacy-first EDR for small teams and home labs, with a device management console and extensive end-to-end encryption."
url: "https://radegast.app"
baseurl: ""

author:
  name: "Radegast EDR Team"
  email: "admin@radegast.app"

github_org: "https://github.com/radegast-edr"
console_url: "https://console.radegast.app"
docs_url: "https://docs.radegast.app"
rustinel_url: "https://github.com/Karib0u/rustinel"
status_url: "https://status.radegast.app"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: /rss.xml

permalink: /blog/:year/:month/:day/:title/

sass:
  style: compressed
  sass_dir: _sass

future: true

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - "*.sh"
  - README.md
  - IMPLEMENTATION_PLAN.md
