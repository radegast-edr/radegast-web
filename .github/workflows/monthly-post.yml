name: Monthly blog post

on:
  schedule:
    - cron: "0 6 7 * *" # 06:00 UTC on the 7th of every month
  workflow_dispatch:
    inputs:
      month:
        description: "Month to summarize (YYYY-MM). Empty = previous month."
        required: false
      force:
        description: "Regenerate even if a recap for that month exists"
        type: boolean
        default: false

permissions:
  contents: write      # push the post branch
  pull-requests: write # open the PR

concurrency:
  group: monthly-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Mistral Vibe
        run: uv tool install mistral-vibe==3.1.5

      - name: Generate post
        env:
          GH_TOKEN: ${{ github.token }}                  # gh CLI: read commits
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }} # Vibe: Mistral API
          MONTH: ${{ inputs.month }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          [[ -n "$MONTH" ]] && args+=(--month "$MONTH")
          [[ "$FORCE" == "true" ]] && args+=(--force)
          bash scripts/monthly-post.sh "${args[@]}"

      - name: Upload Vibe run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-export
          path: .monthly-post-vibe-export.json
          if-no-files-found: ignore

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add _posts/*-recap.md
          if git diff --cached --quiet; then
            echo "No new post to publish."
            exit 0
          fi
          post="$(git diff --cached --name-only | head -n 1)"
          slug="$(basename "$post" .md)"          # e.g. 2026-12-07-november-2026-recap
          # Branch per month (no run date), so a forced re-run updates the same PR.
          branch="monthly-post/$(cut -d- -f4- <<<"$slug")"   # e.g. monthly-post/november-2026-recap

          git config user.name "github-actions[bot]"
          git config user.email "41898243+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "post: add ${slug}"
          # --force: a re-run (e.g. with force=true) replaces the previous draft on the same branch.
          git push --force origin "$branch"

          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR for ${branch} already open; updated its branch."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$branch" \
            --title "post: ${slug}" \
            --body "$(printf '%s\n\n%s\n\n%s\n' \
              "Automated monthly recap generated by Mistral Vibe from last month's commits." \
              "Please review for accuracy before merging: check that every section describes a real, user-facing change. The Vibe run report (cost, tokens) is attached to the [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
              "File: \`${post}\`")"
