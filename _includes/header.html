<header class="site-header">
  <div class="container">
    <div class="header-inner">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        radegast<span>EDR</span>
      </a>

      <nav id="main-nav">
        <a href="{{ '/features/' | relative_url }}" {% if page.url contains '/features' %}class="active" aria-current="page"{% endif %}>Features</a>
        <a href="{{ '/screenshots/' | relative_url }}" {% if page.url contains '/screenshots' %}class="active" aria-current="page"{% endif %}>Screenshots</a>
        <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}class="active" aria-current="page"{% endif %}>Blog</a>
        <a href="{{ site.docs_url }}" target="_blank" rel="noopener noreferrer">Docs</a>
        <a href="{{ '/team/' | relative_url }}" {% if page.url contains '/team' %}class="active" aria-current="page"{% endif %}>Team</a>
        <a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact' %}class="active" aria-current="page"{% endif %}>Contact</a>
      </nav>

      <div class="header-actions">
        <a href="{{ site.console_url }}" class="btn btn-primary btn-console" target="_blank" rel="noopener noreferrer">
          Open Console
        </a>
      </div>

      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="main-nav">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>

<script>
  (function() {
    var toggle = document.getElementById('nav-toggle');
    var header = toggle && toggle.closest('.site-header');
    if (toggle && header) {
      toggle.addEventListener('click', function() {
        var open = header.classList.toggle('nav-open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }
  })();
</script>
